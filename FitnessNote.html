<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#141a2e">
    <title>像素健身日誌</title>
    <style>
        /* CSS Zoning: Font & Tokens */
        @font-face {
            font-family: 'Cubic11';
            src: url('https://cdn.jsdelivr.net/gh/ACh-K/Cubic-11@1.451/fonts/web/Cubic_11.woff2') format('woff2');
            font-display: swap;
        }
        :root {
            --bg: #141a2e;
            --bg2: #1b2240;
            --panel: #222b4d;
            --panel2: #2c3761;
            --hi: #3a4a80;
            --shade: #161c35;
            --line: #090c18;
            --text: #eef2ff;
            --muted: #94a1cc;
            --acc: #49a9f0;
            --acc-ink: #0d1328;
            --good: #5ee08a;
            --warn: #f7d14c;
            --bad: #ff6b6b;
            --paper: #f8f6ec;
            --ink: #232845;
            --px: 4px;
            --safe-b: env(safe-area-inset-bottom, 0px);
        }

        /* CSS Zoning: Reset & Base */
        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0 auto;
            max-width: 520px;
            min-height: 100vh;
            padding: 12px 14px calc(190px + var(--safe-b));
            font-family: 'Cubic11', 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
            color: var(--text);
            background-color: var(--bg);
            background-image:
                radial-gradient(rgba(255,255,255,.06) 1px, transparent 1.5px),
                linear-gradient(180deg, var(--bg2), var(--bg) 420px);
            background-size: 16px 16px, 100% 100%;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            letter-spacing: .02em;
        }
        h1, h2, h3, p { margin: 0; }
        button { font-family: inherit; }
        .hidden { display: none !important; }

        /* CSS Zoning: Pixel Primitives */
        .px-box {
            position: relative;
            background: var(--panel);
            margin: 6px 4px 16px;
            padding: 14px 12px;
            box-shadow:
                0 calc(var(--px) * -1) 0 0 var(--line),
                0 var(--px) 0 0 var(--line),
                calc(var(--px) * -1) 0 0 0 var(--line),
                var(--px) 0 0 0 var(--line),
                inset 0 var(--px) 0 0 var(--hi),
                inset 0 calc(var(--px) * -1) 0 0 var(--shade);
        }
        .btn {
            --b: 3px;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            margin: var(--b);
            padding: 12px 12px;
            border: 0; border-radius: 0;
            background: var(--acc);
            color: var(--acc-ink);
            font-size: 15px;
            line-height: 1.1;
            cursor: pointer;
            box-shadow:
                0 calc(var(--b) * -1) 0 0 var(--line), 0 var(--b) 0 0 var(--line),
                calc(var(--b) * -1) 0 0 0 var(--line), var(--b) 0 0 0 var(--line),
                inset 0 -4px 0 0 rgba(0,0,0,.28), inset 0 3px 0 0 rgba(255,255,255,.35);
            transition: transform 60ms steps(1), filter 120ms;
            user-select: none;
        }
        .btn:active { transform: translateY(2px); box-shadow:
                0 calc(var(--b) * -1) 0 0 var(--line), 0 var(--b) 0 0 var(--line),
                calc(var(--b) * -1) 0 0 0 var(--line), var(--b) 0 0 0 var(--line),
                inset 0 4px 0 0 rgba(0,0,0,.28); }
        .btn.ghost { background: var(--panel2); color: var(--text); }
        .btn.warn { background: var(--warn); }
        .btn.danger { background: #4a2230; color: var(--bad); }
        .btn.small { padding: 8px 10px; font-size: 13px; }
        .btn.block { display: flex; width: calc(100% - 6px); }

        input, textarea, select {
            width: 100%;
            font-family: inherit;
            font-size: 16px;
            color: var(--text);
            background: #0f1428;
            border: 0; border-radius: 0;
            padding: 10px;
            box-shadow: inset 0 0 0 2px var(--line), inset 3px 3px 0 0 rgba(0,0,0,.45);
            -webkit-appearance: none; appearance: none;
        }
        input:focus, textarea:focus { outline: none; box-shadow: inset 0 0 0 2px var(--acc), inset 3px 3px 0 0 rgba(0,0,0,.45); }
        input::placeholder, textarea::placeholder { color: #55628f; }
        input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        input[type=date] { min-height: 40px; }
        input[type=date]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: .7; }

        /* CSS Zoning: Hero (battle scene) */
        .hero-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 2px 4px 12px; }
        .logo { font-size: 20px; line-height: 1; color: var(--warn); text-shadow: 2px 2px 0 var(--line), -1px -1px 0 #b0861d; letter-spacing: .08em; }
        .logo small { display: block; font-size: 11px; color: var(--muted); text-shadow: none; letter-spacing: .1em; margin-top: 6px; }
        .date-pill { width: 150px; flex: 0 0 auto; font-size: 14px; padding: 8px; }

        .stage {
            position: relative;
            height: 150px;
            margin: 4px 4px 0;
            overflow: hidden;
            background:
                linear-gradient(180deg, transparent 62%, #2f7a4e 62%, #2f7a4e 64%, #3f9a5f 64%),
                linear-gradient(180deg, #5d8fe0 0%, #8fc0f5 62%);
            box-shadow: 0 -4px 0 0 var(--line), 4px 0 0 0 var(--line), -4px 0 0 0 var(--line);
        }
        .stage::before, .stage::after {
            content: ''; position: absolute; width: 8px; height: 8px; background: transparent;
            box-shadow:
                8px 0 #fff, 16px 0 #fff, 24px 0 #fff,
                0 8px #fff, 8px 8px #fff, 16px 8px #fff, 24px 8px #fff, 32px 8px #fff, 40px 8px #e4efff;
            image-rendering: pixelated;
            animation: cloud 28s linear infinite;
        }
        .stage::before { top: 14px; left: -60px; }
        .stage::after { top: 40px; left: -60px; animation-duration: 41s; animation-delay: -18s; transform: scale(.7); }
        @keyframes cloud { from { translate: 0 0; } to { translate: 620px 0; } }
        .stage.night {
            background:
                linear-gradient(180deg, transparent 62%, #24513a 62%, #24513a 64%, #2e6b47 64%),
                linear-gradient(180deg, #1d2452 0%, #3b3f7a 62%);
        }
        .platform {
            position: absolute; left: 66%; bottom: 14px; width: 150px; height: 26px; translate: -50% 0;
            background: #6cc77f;
            border-radius: 50%;
            box-shadow: inset 0 -6px 0 0 #3f9a5f, 0 0 0 3px var(--line);
        }
        .mascot {
            position: absolute; left: 66%; bottom: 26px; translate: -50% 0;
            border: 0; background: none; padding: 0; cursor: pointer;
            filter: drop-shadow(0 4px 0 rgba(0,0,0,.25));
        }
        .mon-svg { display: block; }
        .mon-tag {
            position: absolute; left: 8px; top: 8px; min-width: 128px;
            background: var(--paper); color: var(--ink); padding: 6px 8px 7px;
            font-size: 13px;
            box-shadow: 0 -3px 0 var(--line), 0 3px 0 var(--line), -3px 0 0 var(--line), 3px 0 0 var(--line), inset 0 -3px 0 #d8d3bd;
        }
        .mon-tag .row { display: flex; justify-content: space-between; gap: 8px; }
        .mon-tag i { font-style: normal; }
        .mini-bar { margin-top: 5px; height: 8px; background: #4b5170; box-shadow: 0 0 0 2px var(--ink); position: relative; overflow: hidden; }
        .mini-bar > i { position: absolute; inset: 0 auto 0 0; width: 0; background: #40a0f8; transition: width .4s steps(8); }
        .exp-row { margin-top: 3px; font-size: 10px; color: #6b7090; }

        .dialog {
            position: relative;
            margin: 0 4px 18px;
            min-height: 64px;
            padding: 12px 34px 12px 14px;
            background: var(--paper); color: var(--ink);
            font-size: 15px; line-height: 1.55;
            box-shadow:
                0 4px 0 0 var(--line), -4px 0 0 0 var(--line), 4px 0 0 0 var(--line),
                inset 0 0 0 3px #6b7bb8, inset 0 0 0 5px var(--paper), inset 0 0 0 7px #b9c2e6;
        }
        .dialog .caret { position: absolute; right: 14px; bottom: 8px; color: #d9463a; font-size: 12px; animation: blink 1s steps(1) infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* CSS Zoning: Mascot Sprites & Animations */
        .mon-hero, .mon-chip, .mon-thumb { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
        .mon-hero { height: auto; max-width: 160px; max-height: 108px; }
        .mon-chip { width: 44px; height: 40px; object-fit: contain; }
        .mon-thumb { width: 96px; height: 96px; margin: -14px auto -10px; }
        .mon-missing { display: grid; place-items: center; width: 44px; height: 44px; margin: 0 auto; border-radius: 50%; background: linear-gradient(#e94b4b 50%, #fff 50%); box-shadow: 0 0 0 3px var(--line); color: var(--line); font-size: 14px; }
        .mascot.jump img, .mascot.jump .mon-missing { animation: jump .6s steps(1) 1; }
        @keyframes jump { 0% { transform: translateY(0); } 20% { transform: translateY(-14px); } 40% { transform: translateY(-24px) rotate(-6deg); } 60% { transform: translateY(-14px) rotate(6deg); } 80% { transform: translateY(0) scale(1.1, .9); } }
        .mascot.levelup img { animation: levelup 1.2s steps(1) 1; }
        @keyframes levelup { 0%, 30%, 60% { filter: brightness(3) saturate(0); } 15%, 45%, 75% { filter: none; } 85% { transform: translateY(-18px); } }
        .stage.flash::after { content: 'LEVEL UP!'; position: absolute; inset: 0; display: grid; place-items: center; width: auto; height: auto; box-shadow: none; translate: 0 0; transform: none; color: var(--warn); font-size: 24px; text-shadow: 3px 3px 0 var(--line); background: rgba(255,255,255,.25); animation: blink .3s steps(1) 4; }
        .mascot.evolving img { animation: evo 2.8s linear 1 forwards; }
        @keyframes evo {
            0%, 6%, 14%, 20%, 26%, 31%, 36%, 40%, 44%, 48%, 52%, 56%, 60%, 64%, 68%, 72%, 76%, 80%, 84%, 88%, 92%, 96% { filter: brightness(0) invert(1); transform: scale(1); }
            3%, 10%, 17%, 23%, 28.5%, 33.5%, 38%, 42%, 46%, 50%, 54%, 58%, 62%, 66%, 70%, 74%, 78%, 82%, 86%, 90%, 94% { filter: brightness(0) invert(1); transform: scale(.75, 1.15); }
            100% { filter: brightness(0) invert(1); transform: scale(1.1); }
        }
        .stage.evo-bg { background: radial-gradient(circle at 66% 70%, #3a3f7a, #0b0f1c 70%); }
        .stage.evo-bg::before, .stage.evo-bg::after { display: none; }
        .stage.evo-bg .platform { background: #2a2f5a; box-shadow: inset 0 -6px 0 0 #1b1f40, 0 0 0 3px var(--line); }
        .day-chip b small { display: block; font-size: 10px; opacity: .8; font-weight: normal; }
        .swap-btn { position: absolute; left: 8px; bottom: 8px; z-index: 2; border: 0; padding: 6px 8px; font-size: 12px; background: var(--paper); color: var(--ink); cursor: pointer; box-shadow: 0 0 0 3px var(--line), inset 0 -3px 0 #d8d3bd; }
        .swap-btn:active { transform: translateY(2px); }

        /* CSS Zoning: Pokémon Picker */
        .mon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; margin: 12px 0; }
        .mon-cell { position: relative; border: 0; padding: 6px 2px 8px; background: var(--panel2); color: var(--text); cursor: pointer; font-size: 13px; box-shadow: 0 0 0 3px var(--line), inset 0 -3px 0 var(--shade); }
        .mon-cell small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
        .mon-cell .type-dot { position: absolute; left: 6px; top: 6px; width: 8px; height: 8px; box-shadow: 0 0 0 2px var(--line); }
        .mon-cell.sel { background: var(--acc); color: var(--acc-ink); }
        .mon-cell.sel small { color: var(--acc-ink); }
        .mon-cell:active { transform: translateY(2px); }

        /* CSS Zoning: Day Tabs */
        .days { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(60px, 1fr); gap: 10px; overflow-x: auto; padding: 6px 6px 10px; margin: 0 -2px 6px; scrollbar-width: none; }
        .days::-webkit-scrollbar { display: none; }
        .day-chip {
            position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px;
            padding: 14px 2px 6px; border: 0; cursor: pointer;
            background: var(--panel); color: var(--muted); font-size: 12px;
            box-shadow: 0 -3px 0 var(--line), 0 3px 0 var(--line), -3px 0 0 var(--line), 3px 0 0 var(--line), inset 0 -3px 0 var(--shade);
            transition: transform 80ms steps(1);
        }
        .day-chip .mon-svg { filter: grayscale(.55) brightness(.85); }
        .day-chip.active { background: var(--chip, var(--acc)); color: var(--acc-ink); transform: translateY(-3px); }
        .day-chip.active .mon-svg { filter: none; }
        .day-chip .done-dot { position: absolute; left: 4px; top: 4px; width: 6px; height: 6px; background: var(--good); box-shadow: 0 0 0 2px var(--line); }
        .day-chip .next-tag { position: absolute; top: 3px; right: 3px; z-index: 1; background: var(--warn); color: var(--ink); font-size: 10px; line-height: 1; white-space: nowrap; padding: 2px 3px; box-shadow: 0 0 0 2px var(--line); animation: blink 1.2s steps(1) infinite; }

        .day-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .day-bar small { color: var(--acc); font-size: 12px; }
        .day-bar h2 { font-size: 17px; margin-top: 4px; line-height: 1.35; }
        .day-bar .btn { flex: 0 0 auto; }
        .tip-line { margin-top: 8px; font-size: 12px; color: var(--muted); line-height: 1.6; }

        /* CSS Zoning: Exercise Cards */
        .ex-card { animation: pop-in .4s steps(4) both; animation-delay: calc(var(--d, 0) * 50ms); }
        @keyframes pop-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
        .ex-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--acc); }
        .ex-head { display: flex; align-items: center; gap: 8px; margin-left: 4px; }
        .ex-no { flex: 0 0 auto; min-width: 26px; height: 26px; display: grid; place-items: center; font-size: 13px; background: var(--line); color: var(--acc); }
        .ex-name { flex: 1; font-size: 17px; font-weight: normal; line-height: 1.3; word-break: break-word; }
        .ex-count { font-size: 13px; color: var(--muted); }
        .ex-card.clear .ex-count { color: var(--good); }
        .stamp { display: none; position: absolute; right: 10px; top: -12px; background: var(--good); color: var(--ink); font-size: 12px; padding: 2px 6px; box-shadow: 0 0 0 3px var(--line); transform: rotate(6deg); }
        .ex-card.clear .stamp { display: block; animation: stamp .35s steps(3) both; }
        @keyframes stamp { from { transform: scale(2.2) rotate(-10deg); opacity: 0; } to { transform: scale(1) rotate(6deg); opacity: 1; } }

        .ex-meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0 4px; }
        .tag { font-size: 12px; padding: 3px 6px; background: var(--panel2); color: var(--text); box-shadow: 0 0 0 2px var(--line); }
        .tag.acc { background: var(--acc); color: var(--acc-ink); }
        .ex-note { margin: 8px 0 0 4px; font-size: 13px; color: var(--muted); line-height: 1.5; }
        .ex-last { margin: 8px 0 0 4px; font-size: 12px; color: #b6c1e8; line-height: 1.5; }
        .ex-up { display: inline-block; margin: 8px 0 0 4px; padding: 4px 8px; font-size: 12px; background: rgba(247,209,76,.15); color: var(--warn); box-shadow: 0 0 0 2px #6d5a16; animation: blink 1.6s steps(1) 3; }

        .sets { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
        .set-row { display: grid; grid-template-columns: 30px 1fr 12px 1fr 38px; gap: 6px; align-items: center; padding: 6px; background: #1a2241; box-shadow: 0 0 0 2px var(--line); position: relative; transition: background .2s steps(2); }
        .set-row.done { background: color-mix(in srgb, var(--acc) 22%, #1a2241); }
        .set-row.flash { animation: flash .45s steps(3) 1; }
        @keyframes flash { 0% { background: #fff; } 50% { background: var(--acc); } }
        .set-tag { height: 30px; display: grid; place-items: center; font-size: 13px; background: var(--panel2); color: var(--muted); box-shadow: 0 0 0 2px var(--line); }
        .set-row.warm .set-tag { background: #4a3520; color: #ffb15c; }
        .set-row.done .set-tag { background: var(--acc); color: var(--acc-ink); }
        .field { position: relative; display: block; min-width: 0; }
        .field input { text-align: center; padding: 9px 22px 9px 6px; font-size: 18px; }
        .field em { position: absolute; right: 6px; top: 50%; translate: 0 -50%; font-style: normal; font-size: 11px; color: var(--muted); pointer-events: none; }
        .x { text-align: center; color: var(--muted); font-size: 13px; }
        .del { height: 38px; width: 38px; border: 0; background: #3a1f2c; color: var(--bad); font-size: 15px; cursor: pointer; box-shadow: 0 0 0 2px var(--line), inset 0 -3px 0 rgba(0,0,0,.3); }
        .del:active { transform: translateY(2px); }
        .add-set { margin-top: 12px; }
        .exp-pop { position: absolute; right: 52px; top: -4px; color: var(--warn); font-size: 13px; text-shadow: 2px 2px 0 var(--line); pointer-events: none; animation: exp-pop .9s steps(6) forwards; }
        @keyframes exp-pop { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-26px); opacity: 0; } }

        /* CSS Zoning: Editor */
        .ed-top { display: flex; gap: 8px; align-items: center; }
        .ed-top .ed-name { flex: 1; min-width: 0; }
        .ed-move { display: flex; gap: 6px; }
        .ed-move button { width: 34px; height: 38px; border: 0; background: var(--panel2); color: var(--text); cursor: pointer; box-shadow: 0 0 0 2px var(--line); font-size: 13px; }
        .ed-move button:active { transform: translateY(2px); }
        .ed-move .del { width: 34px; }
        .ed-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
        .ed-grid label, .lbl { display: block; font-size: 11px; color: var(--muted); }
        .ed-grid input { margin-top: 4px; text-align: center; padding: 8px 4px; }
        .ed-note { margin-top: 8px; font-size: 14px; }
        .add-row { display: flex; gap: 8px; align-items: center; }
        .add-row input { flex: 1; min-width: 0; }
        .ed-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 4px 0 20px; }

        /* CSS Zoning: Bag (settings) */
        .bag summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
        .bag summary::-webkit-details-marker { display: none; }
        .bag summary::after { content: '▶'; font-size: 11px; color: var(--acc); transition: transform .15s steps(2); }
        .bag[open] summary::after { transform: rotate(90deg); }
        .bag h4 { margin: 14px 0 6px; font-size: 13px; color: var(--acc); font-weight: normal; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .bag p { font-size: 12px; color: var(--muted); line-height: 1.6; margin-top: 8px; }

        /* CSS Zoning: Dock (bottom bar) */
        .dock {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
            padding: 10px 14px calc(10px + var(--safe-b));
            background: rgba(16, 21, 40, .96);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 -4px 0 0 var(--line), 0 -8px 0 0 var(--panel2);
        }
        .dock-inner { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
        .dock-row { display: flex; align-items: center; gap: 8px; min-height: 26px; font-size: 13px; }
        .exp-label { color: var(--warn); font-size: 12px; }
        .exp-bar { flex: 1; height: 12px; background: #0b0f1f; box-shadow: 0 0 0 2px var(--line), inset 0 0 0 2px #2b3460; position: relative; overflow: hidden; }
        .exp-bar > i {
            position: absolute; inset: 2px auto 2px 2px; width: 0; max-width: calc(100% - 4px);
            background: repeating-linear-gradient(90deg, var(--acc) 0 6px, color-mix(in srgb, var(--acc) 70%, #fff) 6px 8px);
            background-size: 16px 100%;
            transition: width .5s steps(10);
            animation: shimmer 1s steps(4) infinite;
        }
        @keyframes shimmer { to { background-position: 16px 0; } }
        .exp-text { min-width: 64px; text-align: right; color: var(--text); font-size: 12px; }
        .pill { padding: 3px 7px; background: var(--line); color: var(--acc); font-size: 13px; }
        .quote { flex: 1; text-align: right; color: var(--good); font-size: 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .rest { flex: 1; display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
        .rest span { color: var(--muted); font-size: 12px; }
        .rest b { font-weight: normal; font-size: 16px; color: var(--warn); min-width: 46px; text-align: center; }
        .rest.go b { color: var(--good); animation: blink .4s steps(1) infinite; }
        .rest button { border: 0; background: var(--panel2); color: var(--text); font-size: 12px; padding: 5px 8px; box-shadow: 0 0 0 2px var(--line); cursor: pointer; }
        .dock-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

        /* CSS Zoning: Modal & Toast */
        .modal { position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-end; justify-content: center; background: rgba(5, 7, 16, .78); opacity: 0; pointer-events: none; transition: opacity .2s steps(3); padding: 12px 10px calc(12px + var(--safe-b)); }
        .modal.active { opacity: 1; pointer-events: auto; }
        .modal-card { width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto; transform: translateY(30px); transition: transform .25s steps(4); margin: 4px; }
        .modal.active .modal-card { transform: none; }
        .modal-card h3 { font-size: 16px; font-weight: normal; color: var(--acc); margin-bottom: 12px; }
        .modal-card textarea { min-height: 220px; font-size: 13px; line-height: 1.45; font-family: ui-monospace, Menlo, Consolas, monospace; }

            '腿推機': 160, '腿屈伸機': 55, '腿彎舉機': 50, '髖外展機': 45, '坐姿小腿推蹬機': 70,
            'T Bar 划船機': 65, '高位下拉機 反握窄距': 65, '坐姿後束機': 35, 'Cable 臉拉': 22, '肩推機': 55, '蝴蝶機反向': 30, 'Cable 側平舉': 6,
            '髖內收機': 45, 'Cable 過頭三頭伸展': 15, 'Cable 二頭彎舉': 15, '哈克深蹲機': 60, '臥式腿彎舉機': 35, '臀推機': 60, '腹部捲腹機': 35
        };

        const TIPS = [
            '全部正式組都做到次數上限，下次就加重 2.5–5kg！',
            '每組留 1–2 下力氣（RIR 1–2），品質比硬撐重要。',
            '離心慢放 2–3 秒，肌肉受力時間更長。',
            '動作名稱保持一致，重量才會自動延續喔。',
            '睡滿 7 小時以上，肌肉才長得快。',
            '蛋白質每公斤體重 1.6–2.2g，分散在各餐。',
            '器械座椅高度記下來，每次一樣才好比較進步。'
        ];

        /* JS Zoning: Storage Helpers */
        const PROGRAM_KEY = 'pixelgym_program_v1';
        const TEAM_KEY = 'pixelgym_team_v1';
        const MIGRATION_KEY = 'pixelgym_mig_mon_v1';
        const REC_RE = /^workout_(\d{4}-\d{2}-\d{2})_(.+)$/;
        const LS = {
            get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
            set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { toast('儲存失敗，瀏覽器空間可能不足'); } },
            del(k) { try { localStorage.removeItem(k); } catch (e) {} }
        };
        const clone = o => JSON.parse(JSON.stringify(o));
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const hasReps = s => String(s.reps ?? '').trim() !== '';
        const num = v => parseFloat(v) || 0;
        const clampInt = (v, min, max, def) => { const n = parseInt(v, 10); return isNaN(n) ? def : Math.min(max, Math.max(min, n)); };

        /* Local date, not UTC: toISOString() gives yesterday before 08:00 in Taiwan. */
        function localDateStr(d = new Date()) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function listRecords() {
            const out = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const m = key && key.match(REC_RE);
                if (!m || /_(startTime|meta)$/.test(key)) continue;
                const data = LS.get(key, null);
                if (!Array.isArray(data)) continue;
                out.push({ key, date: m[1], dayId: m[2], data, trained: data.some(e => (e.sets || []).some(hasReps)) });
            }
            return out.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
        }

        function normalizeProgram(raw) {
            if (!raw || typeof raw !== 'object') return null;
            let days = raw.days;
            if (!Array.isArray(days)) {
                const entries = Object.entries(raw);
                if (!entries.length || !entries.every(([, v]) => Array.isArray(v))) return null;
                days = entries.map(([id, list]) => ({ id, title: id, exercises: list }));
            }
            const usedIds = new Set();
            const out = days.filter(d => d && typeof d === 'object').map((d, i) => {
                let id = String(d.id || `Day${i + 1}`).trim().replace(/\s+/g, '_') || `Day${i + 1}`;
                while (usedIds.has(id)) id += 'b';
                usedIds.add(id);
                const exercises = (Array.isArray(d.exercises) ? d.exercises : [])
                    .map(e => (typeof e === 'string' ? { name: e } : e))
                    .filter(e => e && String(e.name ?? '').trim())
                    .map(e => ({
                        name: String(e.name).trim(),
                        sets: clampInt(e.sets, 1, 10, 3),
                        reps: String(e.reps ?? '8-12').trim() || '8-12',
                        rest: clampInt(e.rest, 15, 600, 90),
                        warmup: clampInt(e.warmup, 0, 3, 0),
                        note: String(e.note ?? '').trim()
                    }));
                return { id, title: String(d.title || `DAY ${i + 1}`).trim(), exercises };
            });
            if (!out.length) return null;
            return { format: PROGRAM_FORMAT, name: String(raw.name || '我的課表').trim(), days: out };
        }

        /* JS Zoning: State */
        let program = normalizeProgram(LS.get(PROGRAM_KEY, null)) || clone(DEFAULT_PROGRAM);
        let team = LS.get(TEAM_KEY, {}) || {};
        const state = {
            date: localDateStr(),
            dayId: null,
            data: [],
            saved: false,
            records: [],
            lastPerf: {},
            editing: false,
            draft: null,
            milestones: new Set(),
            baseExp: {},
            shownLv: 0,
            shownForm: 0,
            evolving: false,
            taps: 0,
            rest: null
        };
        let saveTimer = null, tickTimer = null, restTimer = null, typeTimer = null, toastTimer = null;

        /* JS Zoning: DOM */
        const $ = id => document.getElementById(id);
        const dateInput = $('dateInput'), dayTabs = $('dayTabs'), workoutContainer = $('workoutContainer');
        const dayIndexEl = $('dayIndex'), dayTitleEl = $('dayTitle'), editBtn = $('editBtn'), dayBar = $('dayBar');
        const mascotEl = $('mascot'), monNameEl = $('monName'), monLvEl = $('monLv'), hpFill = $('hpFill'), stage = $('stage');
        const dialogText = $('dialogText'), dock = $('dock'), bag = $('bag');
        const expFill = $('expFill'), expText = $('expText'), durationPill = $('durationPill'), quoteEl = $('quote');
        const restBox = $('restBox'), restTimeEl = $('restTime');

        /* JS Zoning: Day / Program Helpers */
        const getDay = () => program.days.find(d => d.id === state.dayId) || program.days[0];
        const dayIndexOf = id => Math.max(0, program.days.findIndex(d => d.id === id));
        /* Team: which Pokémon trains on which day. Each session also stores its Pokémon in the _meta key. */
        /* Returns the evolution line (base id) for a day. */
        function monIdFor(dayId) {
            if (baseOf(team[dayId])) return baseOf(team[dayId]);
            let idx = program.days.findIndex(d => d.id === dayId);
            if (idx < 0) { const m = String(dayId).match(/(\d+)/); idx = m ? parseInt(m[1], 10) - 1 : 0; }
            return DEFAULT_TEAM[Math.max(0, idx) % DEFAULT_TEAM.length];
        }
        /* Current evolved form of a line, given its level. */
        const formOf = base => MON[formAt(base, levelOfMon(base))];
        function currentMonId() {
            const meta = LS.get(metaKey(), null);
            return meta && baseOf(meta.mon) ? baseOf(meta.mon) : monIdFor(state.dayId);
        }
        const recKey = () => `workout_${state.date}_${state.dayId}`;
        const metaKey = () => `${recKey()}_meta`;

        const WEEKDAYS = ['週一', '週二', '週三', '週四', '週五', '週六', '週日'];
        /* Monday = 0 ... Sunday = 6 (parsed as local date). */
        function weekdayIndex(date) {
            const [y, m, d] = date.split('-').map(Number);
            return (new Date(y, m - 1, d).getDay() + 6) % 7;
        }
        /* Weekday decides the day (Mon→D1 … Fri→D5). Days beyond the program length (e.g. weekend) fall back to rotation. */
        function suggestedDayFor(date) {
            const ids = program.days.map(d => d.id);
            const wd = weekdayIndex(date);
            if (wd < ids.length) return ids[wd];
            const prev = state.records.find(r => r.trained && r.date < date && ids.includes(r.dayId));
            if (!prev) return ids[0];
            return ids[(ids.indexOf(prev.dayId) + 1) % ids.length];
        }

        function pickDayFor(date) {
            const ids = program.days.map(d => d.id);
            const same = state.records.find(r => r.trained && r.date === date && ids.includes(r.dayId));
            return same ? same.dayId : suggestedDayFor(date);
        }

        function findLastPerformance(name) {
            const key = recKey();
            for (const r of state.records) {
                if (r.key === key || r.date > state.date) continue;
                const found = r.data.find(e => e.exerciseName === name);
                if (found && (found.sets || []).some(hasReps)) return { date: r.date, sets: found.sets };
            }
            return null;
        }

        function roundTo(w, step = 2.5) { return Math.round(w / step) * step; }

        /* Bug fix: default weights come from the last session of the same exercise, not a fixed table. */
        function buildSets(cfg, last) {
            const lastFormal = last ? last.sets.filter(s => !s.isWarmup && hasReps(s)) : [];
            const lastWarm = last ? last.sets.filter(s => s.isWarmup && String(s.weight ?? '').trim() !== '') : [];
            const fallback = DEFAULT_WEIGHTS[cfg.name] != null ? String(DEFAULT_WEIGHTS[cfg.name]) : '';
            const formalW = i => (lastFormal.length ? String(lastFormal[Math.min(i, lastFormal.length - 1)].weight ?? '') : fallback);
            const ramps = { 1: [0.5], 2: [0.4, 0.65], 3: [0.4, 0.6, 0.8] }[cfg.warmup] || [];
            const sets = [];
            ramps.forEach((f, i) => {
                const top = num(formalW(0));
                const w = lastWarm[i] ? String(lastWarm[i].weight) : (top ? String(roundTo(top * f)) : '');
                sets.push({ isWarmup: true, weight: w, reps: '' });
            });
            for (let i = 0; i < cfg.sets; i++) sets.push({ isWarmup: false, weight: formalW(i), reps: '' });
            return sets;
        }

        function repTop(reps) { const m = String(reps).match(/(\d+)\s*$/); return m ? parseInt(m[1], 10) : null; }

        /* JS Zoning: Load Day */
        function loadDay() {
            state.records = listRecords();
            const day = getDay();
            state.dayId = day.id;
            state.lastPerf = {};
            const saved = LS.get(recKey(), null);
            if (Array.isArray(saved)) {
                state.data = saved.map(e => ({ exerciseName: String(e.exerciseName ?? ''), sets: (e.sets || []).map(s => ({ isWarmup: !!s.isWarmup, weight: String(s.weight ?? ''), reps: String(s.reps ?? '') })) }));
                state.saved = true;
            } else {
                state.data = day.exercises.map(cfg => ({ exerciseName: cfg.name, sets: buildSets(cfg, findLastPerformance(cfg.name)) }));
                state.saved = false;
            }
            state.data.forEach(e => { state.lastPerf[e.exerciseName] = findLastPerformance(e.exerciseName); });
            state.milestones = new Set();
            state.baseExp = computeBaseExp();
            state.shownLv = 0;
            state.shownForm = 0;
        }

        /* EXP from every other session; the session on screen is added live. */
        function computeBaseExp() {
            const exp = {}, key = recKey();
            state.records.forEach(r => {
                if (r.key === key || !r.trained) return;
                const meta = LS.get(`${r.key}_meta`, null);
                const id = meta && baseOf(meta.mon) ? baseOf(meta.mon) : monIdFor(r.dayId);
                exp[id] = (exp[id] || 0) + sessionRatio(r.data);
            });
            return exp;
        }
        function sessionRatio(data) {
            let d = 0, t = 0;
            data.forEach(e => (e.sets || []).forEach(s => { t++; if (hasReps(s)) d++; }));
            return t ? d / t : 0;
        }
        const levelOf = exp => Math.min(100, 1 + Math.floor(exp + 1e-9));
        const levelOfMon = id => levelOf((state.baseExp[id] || 0) + (id === currentMonId() ? sessionRatio(state.data) : 0));

        function save() {
            clearTimeout(saveTimer);
            if (state.editing) return;
            LS.set(recKey(), state.data);
            state.saved = true;
            const { done, total } = countSets();
            const meta = LS.get(metaKey(), null) || {};
            const legacyStart = LS.get(`${recKey()}_startTime`, null);
            if (done > 0) {
                meta.mon = currentMonId();
                meta.start = meta.start || (legacyStart ? parseInt(legacyStart, 10) : Date.now());
                meta.last = Date.now();
                if (done === total) meta.end = meta.end || Date.now(); else delete meta.end;
                LS.set(metaKey(), meta);
            } else {
                LS.del(metaKey()); LS.del(`${recKey()}_startTime`);
            }
            updateDuration();
        }
        const debounceSave = () => { clearTimeout(saveTimer); saveTimer = setTimeout(save, 400); };

        /* JS Zoning: Rendering */
        function renderAll() {
            loadDay();
            renderTabs();
            renderHero();
            renderDayBar();
            if (state.editing) renderEditor(); else renderWorkout();
            updateProgress(true);
            updateDuration();
        }

        function renderTabs() {
            const suggested = suggestedDayFor(state.date);
            const trainedToday = new Set(state.records.filter(r => r.trained && r.date === state.date).map(r => r.dayId));
            const wdLabels = {};
            program.days.forEach((d, i) => { if (i < 7) wdLabels[d.id] = WEEKDAYS[i].slice(1); });
            dayTabs.innerHTML = program.days.map((d, i) => {
                const mon = formOf(d.id === state.dayId ? currentMonId() : monIdFor(d.id));
                return `
                <button class="day-chip ${d.id === state.dayId ? 'active' : ''}" data-day="${esc(d.id)}" style="--chip:${mon.color}">
                    ${trainedToday.has(d.id) ? '<i class="done-dot"></i>' : ''}
                    ${d.id === suggested && !trainedToday.size ? '<span class="next-tag">今天</span>' : ''}
                    ${monImg(mon.id, 'mon-chip')}
                    <b>D${i + 1}${wdLabels[d.id] ? `<small>${wdLabels[d.id]}</small>` : ''}</b>
                </button>`;
            }).join('');
        }

        function setHeroSprite(id) {
            const mon = MON[id];
            document.documentElement.style.setProperty('--acc', mon.color);
            mascotEl.innerHTML = monImg(id, 'mon-hero');
            monNameEl.textContent = mon.name;
            const img = mascotEl.querySelector('img');
            if (!img) return;
            const fit = () => fitSprite(img, 150, 104);
            if (img.complete && img.naturalWidth) fit(); else img.addEventListener('load', fit);
        }

        function renderHero() {
            const mon = formOf(currentMonId());
            setHeroSprite(mon.id);
            const h = new Date().getHours();
            stage.classList.toggle('night', h >= 19 || h < 6);
            const wd = weekdayIndex(state.date);
            const task = getDay().title.replace(/^DAY\s*\d+\s*—\s*/, '');
            say(wd >= program.days.length && !state.saved
                ? `${WEEKDAYS[wd]}是休息日～想補練的話，${mon.name}幫你排了「${task}」。`
                : `去吧！${mon.name}！${WEEKDAYS[wd]}的任務是「${task}」。`);
        }

        function renderDayBar() {
            const idx = dayIndexOf(state.dayId);
            const wd = weekdayIndex(state.date);
            const tag = state.dayId === suggestedDayFor(state.date) ? (wd < program.days.length ? ` · ${WEEKDAYS[wd]}課表` : ' · 週末補課建議') : '';
            dayIndexEl.textContent = `DAY ${idx + 1} / ${program.days.length}${tag}`;
            dayTitleEl.textContent = getDay().title;
            editBtn.classList.toggle('hidden', state.editing);
            dock.classList.toggle('hidden', state.editing);
        }

        function fmtRest(sec) { return sec >= 60 ? `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}` : `${sec}s`; }
        function fmtSets(sets) { return sets.filter(s => !s.isWarmup && hasReps(s)).map(s => `${s.weight || 0}×${s.reps}`).join('・'); }

        function renderWorkout() {
            const cfgMap = Object.fromEntries(getDay().exercises.map(c => [c.name, c]));
            workoutContainer.innerHTML = state.data.map((exData, i) => {
                const cfg = cfgMap[exData.exerciseName];
                const last = state.lastPerf[exData.exerciseName];
                let formalNo = 0;
                const rows = exData.sets.map((s, si) => `
                    <div class="set-row ${s.isWarmup ? 'warm' : ''} ${hasReps(s) ? 'done' : ''}" data-set="${si}">
                        <span class="set-tag">${s.isWarmup ? '熱' : ++formalNo}</span>
                        <label class="field"><input class="in-w" type="number" inputmode="decimal" step="0.5" value="${esc(s.weight)}" placeholder="—"><em>kg</em></label>
                        <span class="x">×</span>
                        <label class="field"><input class="in-r" type="number" inputmode="numeric" value="${esc(s.reps)}" placeholder="${esc(s.isWarmup ? '8' : (cfg ? cfg.reps : '次'))}"><em>下</em></label>
                        <button class="del" data-action="del-set" aria-label="刪除這組">✕</button>
                    </div>`).join('');

                let upHint = '';
                if (cfg && last) {
                    const top = repTop(cfg.reps);
                    const lf = last.sets.filter(s => !s.isWarmup && hasReps(s));
                    if (top && lf.length >= cfg.sets && lf.every(s => parseInt(s.reps, 10) >= top)) upHint = `<span class="ex-up">▲ 上次全組達 ${top} 下，今天加重 2.5–5kg！</span>`;
                }
                return `
                    <section class="px-box ex-card ${isClear(exData) ? 'clear' : ''}" data-ex="${i}" style="--d:${i}">
                        <span class="stamp">CLEAR!</span>
                        <div class="ex-head">
                            <span class="ex-no">${i + 1}</span>
                            <h3 class="ex-name">${esc(exData.exerciseName)}</h3>
                            <span class="ex-count">${exData.sets.filter(hasReps).length}/${exData.sets.length}</span>
                        </div>
                        ${cfg ? `<div class="ex-meta"><span class="tag acc">${cfg.sets} 組 × ${esc(cfg.reps)} 下</span><span class="tag">休息 ${fmtRest(cfg.rest)}</span>${cfg.warmup ? `<span class="tag">熱身 ${cfg.warmup}</span>` : ''}</div>` : ''}
                        ${cfg && cfg.note ? `<p class="ex-note">▸ ${esc(cfg.note)}</p>` : ''}
                        ${last ? `<p class="ex-last">上次 ${last.date.slice(5).replace('-', '/')}：${esc(fmtSets(last.sets)) || '—'}</p>` : '<p class="ex-last">首次挑戰！重量用預設值</p>'}
                        ${upHint}
                        <div class="sets">${rows}</div>
                        <button class="btn ghost small block add-set" data-action="add-set">＋ 加一組</button>
                    </section>`;
            }).join('') || '<div class="px-box">這天還沒有動作，按右上「編輯」新增吧！</div>';
        }

        const isClear = exData => exData.sets.length > 0 && exData.sets.every(hasReps);

        function countSets() {
            let done = 0, total = 0;
            state.data.forEach(e => e.sets.forEach(s => { total++; if (hasReps(s)) done++; }));
            return { done, total };
        }

        function updateProgress(silent) {
            const { done, total } = countSets();
            const pct = total ? Math.round(done / total * 100) : 0;
            expFill.style.width = `calc(${pct}% - ${pct ? 4 : 0}px)`;
            expText.textContent = `${done}/${total} · ${pct}%`;
            const mon = monNameEl.textContent;
            const lines = [
                [100, `今天的訓練完美達成！${mon}獲得了滿滿的經驗值！`, '訓練達成！辛苦了！'],
                [80, `最後幾組了！${mon}使出了全力！`, '最後衝刺，守住動作品質'],
                [50, `效果絕佳！${mon}的肌肉正在膨脹中…`, '過半了，保持節奏'],
                [1, `${mon}熱身完畢，開始戰鬥！`, '']
            ];
            const hit = lines.find(([th]) => pct >= th);
            quoteEl.textContent = hit ? hit[2] : '';
            if (!silent && hit && !state.milestones.has(hit[0])) {
                say(hit[1]);
                if (hit[0] === 100) jumpMascot();
            }
            if (hit) lines.forEach(([th]) => { if (pct >= th) state.milestones.add(th); });
            else state.milestones.clear();
            updateLevel(silent, total ? done / total : 0);
        }

        /* JS Zoning: Pokémon Level (1 full workout = 1 level; partial = proportional EXP) */
        function updateLevel(silent, ratio) {
            const base = currentMonId();
            const exp = (state.baseExp[base] || 0) + ratio;
            const lv = levelOf(exp);
            const frac = lv >= 100 ? 1 : exp - Math.floor(exp + 1e-9);
            const form = formAt(base, lv);
            monLvEl.textContent = lv;
            hpFill.style.width = `${Math.round(frac * 100)}%`;
            $('monExp').textContent = lv >= 100 ? 'MAX' : `${Math.round(frac * 100)}%`;
            const prevLv = state.shownLv, prevForm = state.shownForm;
            state.shownLv = lv; state.shownForm = form;
            if (state.evolving) return;
            if (!silent && prevLv && lv > prevLv) {
                if (prevForm && form !== prevForm) evolve(prevForm, form, lv);
                else levelUp(MON[form].name, lv);
            } else if (prevForm && form !== prevForm) {
                setHeroSprite(form); renderTabs();
            }
        }

        /* Game-style evolution: white silhouette flicker, then the new form appears. */
        function evolve(fromId, toId, lv) {
            const a = MON[fromId], b = MON[toId];
            state.evolving = true;
            say(`咦？${a.name}的樣子……！`);
            mascotEl.classList.remove('levelup');
            mascotEl.classList.add('evolving'); stage.classList.add('evo-bg');
            if (navigator.vibrate) navigator.vibrate([100, 100, 100, 100, 100, 100, 400]);
            setTimeout(() => {
                state.evolving = false;
                mascotEl.classList.remove('evolving'); stage.classList.remove('evo-bg');
                const now = state.shownForm;
                setHeroSprite(now);
                renderTabs();
                if (now !== toId) return;
                void mascotEl.offsetWidth; mascotEl.classList.add('levelup');
                say(`恭喜！${a.name}進化成了${b.name}！（Lv.${lv}）`);
                toast(`${a.name} 進化成 ${b.name}！`);
            }, 2800);
        }

        function levelUp(name, lv) {
            say(`恭喜！${name}升到了 Lv.${lv}！`);
            toast(`${name} 升級了！Lv.${lv}`);
            mascotEl.classList.remove('levelup'); stage.classList.remove('flash');
            void mascotEl.offsetWidth;
            mascotEl.classList.add('levelup'); stage.classList.add('flash');
            setTimeout(() => stage.classList.remove('flash'), 1400);
            if (navigator.vibrate) navigator.vibrate([80, 60, 80, 60, 200]);
        }

        function updateDuration() {
            clearInterval(tickTimer);
            const meta = LS.get(metaKey(), null);
            const legacyStart = LS.get(`${recKey()}_startTime`, null);
            const start = meta && meta.start ? meta.start : (legacyStart ? parseInt(legacyStart, 10) : null);
            const show = () => {

        function buildProgramExport() {

==================== 匯入格式說明 ====================
這段是給你或 AI 看的。修改後把 BEGIN PROGRAM 到 END PROGRAM
（含這兩行）貼回 App「道具包 → 匯入課表」即可；

【結構】（// 後面是說明，實際 JSON 裡不能有註解）
{

【規則】

【給 AI 的指令範例】
請依照上面的匯入格式修改這份課表：（寫你的需求，例如：腿加量、二頭多一點、每天控制在 60 分鐘內）。

        function parseProgramText(text) {
            let body = String(text || '').trim();
            const b = body.indexOf('-----BEGIN PROGRAM-----');
            if (b >= 0) {
                const e = body.indexOf('-----END PROGRAM-----', b);
                body = body.slice(b + 23, e > b ? e : undefined);
            } else {
                const fence = body.match(/```(?:json)?\s*([\s\S]*?)```/i);
                if (fence) body = fence[1];
            }
            const s = body.indexOf('{'), e = body.lastIndexOf('}');
            if (s < 0 || e < s) throw new Error('找不到課表 JSON');
            body = body.slice(s, e + 1);
            let raw;
            try { raw = JSON.parse(body); } catch (err) {
                const relaxed = body.replace(/^\s*\/\/.*$/gm, '').replace(/,\s*([}\]])/g, '$1');
                raw = JSON.parse(relaxed);
            }
            const p = normalizeProgram(raw);
            if (!p) throw new Error('格式不符：需要 days 陣列');
            return p;
        }

        function importProgramFromText(text) {
            let p;
            try { p = parseProgramText(text); } catch (err) { toast('匯入失敗：' + err.message); return; }
            const count = p.days.reduce((a, d) => a + d.exercises.length, 0);
            if (!confirm(`匯入「${p.name}」：${p.days.length} 天、${count} 個動作。\n會覆蓋目前課表（訓練紀錄保留），確定？`)) return;
            program = p;
            LS.set(PROGRAM_KEY, program);
            closeModals();
            state.records = listRecords();
            state.dayId = pickDayFor(state.date);
            renderAll();
            toast('課表匯入成功！');
        }

        function importBackup(file) {

            };
            reader.readAsText(file);
        }

            $('importDataBtn').addEventListener('click', () => $('importDataFile').click());
            $('importDataFile').addEventListener('change', e => { const f = e.target.files[0]; if (f) importBackup(f); e.target.value = ''; });

            document.addEventListener('visibilitychange', () => { if (!document.hidden && !state.editing) updateDuration(); });
        }

        /* JS Zoning: Pokémon Picker */
        function openPicker() {
            const cur = currentMonId();
            const idx = dayIndexOf(state.dayId);
            $('pickerTitle').textContent = `選擇 DAY ${idx + 1} 的訓練夥伴`;
            $('pickerSearch').value = '';
            /* Only base forms are selectable; a line that has already evolved shows its current form name. */
            $('monGrid').innerHTML = BASES.map(id => {
                const lv = levelOfMon(id), form = MON[formAt(id, lv)];
                const names = LINE[id].map(x => MON[x].name).join(' ');
                return `
                <button class="mon-cell ${id === cur ? 'sel' : ''}" data-mon="${id}" data-name="${names}">
                    <i class="type-dot" style="background:${MON[id].color}"></i>
                    ${monImg(id, 'mon-thumb', false)}
                    ${MON[id].name}<small>Lv.${lv}${form.id !== id ? ` · 已進化為${form.name}` : ''}</small>
                </button>`;
            }).join('');
            openModal('pickerModal');
        }

        function pickMon(id) {
            if (!LINE[id]) return;
            team[state.dayId] = id;
            LS.set(TEAM_KEY, team);
            const meta = LS.get(metaKey(), null);
            if (meta) { meta.mon = id; LS.set(metaKey(), meta); }
            closeModals();
            state.shownLv = 0; state.shownForm = 0;
            renderTabs(); renderHero();
            updateProgress(true);
            jumpMascot();
        }

        function evoInfo() {
            const base = currentMonId(), lv = levelOfMon(base), cur = MON[formAt(base, lv)], next = nextEvo(base, lv);
            if (!next) return LINE[base].length > 1 ? `${cur.name}已經是最終型態了！Lv.${lv}` : `${cur.name}不會進化，但會越來越強！Lv.${lv}`;
            const left = next.lvl - lv;
            return `${cur.name} Lv.${lv}：再升 ${left} 級（約 ${left} 次完整訓練）就會進化成${next.name}！${next.special ? '（原作為特殊進化，這裡改成等級進化）' : ''}`;
        }

        /* One-time: tag existing sessions with the Pokémon that was on that day, so later team changes don't move old EXP. */
        function stampSessionMons() {
            listRecords().forEach(r => {
                if (!r.trained) return;
                const k = `${r.key}_meta`, meta = LS.get(k, null) || {};
                if (baseOf(meta.mon)) return;
                meta.mon = monIdFor(r.dayId);
                LS.set(k, meta);
            });
        }

        function init() {
            if (!LS.get(PROGRAM_KEY, null)) LS.set(PROGRAM_KEY, program);
            if (!LS.get(MIGRATION_KEY, false)) { stampSessionMons(); LS.set(MIGRATION_KEY, true); }
            dateInput.value = state.date;
            state.records = listRecords();
            state.dayId = pickDayFor(state.date);
            bindEvents();
            renderAll();
        }

        init();
    </script>
</body>
</html>
